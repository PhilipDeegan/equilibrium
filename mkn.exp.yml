#! clean build -qp mod -dtOa -fPIC -g 0

name: equilibrium

property:
  tpp.bin: ${MKN_ROOT}/tpp/bin
  tpp.dbg: ${MKN_ROOT}/tpp/dbg

profile:
- name: mod
  inc: inc
  src: src/mod.cpp
  dep: mkn.avx lang.nanobind
  mode: none
  mod: lang.python3 python3.module
  out: cpp
  install: equilibrium
  # arg: -ftree-vectorize -fopt-info-vec -fopt-info-inline -fopt-info-inline-optimized -fopt-info-vec-optimized -fopt-info-vec-missed
  env: |
    MKN_LIB_LINK_LIB=1
    MKN_PYTHON_LIB_EMBED=1


- name: gl.base
  inc: inc
  dep: mkn.gl
  arg: -DGLM_ENABLE_EXPERIMENTAL=1

- name: gl.particles
  parent: gl.base
  mode: none
  main: res/eq/gl/tutorial18_particles.cpp

- name: gl.billboard
  parent: gl.base
  mode: none
  main: res/eq/gl/tutorial18_billboards.cpp

- name: sphere
  parent: gl.base
  mode: none
  lib: glut32
  src: res/eg/gl/sphere/src
  inc: res/eg/gl/sphere/src/glut/include
  path: res/eg/gl/sphere/src/glut/lib
  main: res/eg/gl/sphere/src/main.cpp

- name: sphereShader
  parent: gl.base
  main: res/eg/gl/sphereShader/src/main.cpp
  src: res/eg/gl/sphereShader/src
  inc: res/eg/gl/sphereShader/src/glad/include


- name: cube
  parent: gl.base
  main: res/eg/cube/src/main.cpp
  src: res/eg/cube/src
  inc: /usr/include/pcl-1.13 /usr/include/eigen3
  lib: pcl_common pcl_filters pcl_io pcl_features pcl_segmentation pcl_search pcl_kdtree
  # apt install libpcl-dev && updatedb && locate libpcl | grep "\.so"


- name: col_
  out: col
  main: src/col.cpp
  dep: mkn.kul
  mode: none
  inc: ${tpp.bin}/include

- name: col
  parent: col_
  path: ${tpp.bin}/lib
  lib: SDL2-2.0 SDL2_ttf-2.0
- name: col_dbg
  parent: col_
  path: ${tpp.dbg}/lib
  lib: SDL2-2.0d SDL2_ttf-2.0d

- name: blockamok
  inc: ${tpp.bin}/include
  lib: SDL2-2.0 SDL2_ttf-2.0
  path: ${tpp.bin}/lib
  main: src/main.cpp
  src: src
