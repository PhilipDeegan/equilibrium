name: Build

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request: # not drafts (each job's if): a draft's pushes cost no Actions minutes, being
    #  marked ready for review runs everything once; test locally meanwhile
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build:
    if: ${{ !github.event.pull_request.draft }}
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    container: ghcr.io/pharchive/phare_dep/ubuntu:24.04

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        python-version: ['3.13']

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64

    - run: |
        apt update && apt install -y curl
        curl -Lo mkn https://github.com/mkn/mkn/releases/download/latest/mkn_nix
        chmod +x mkn
        KLOG=3 ./mkn clean build -dtKOqp mod,mod_lattice test -Wx res/mkn/mpi

    - run: |
        python3 -m pip install -r requirements.txt
        export EQ_TEST_N_THREADS=1
        ./sh/test.sh
