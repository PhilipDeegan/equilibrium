name: format

# changed lines and files only: the code that predates these gates is not yet clean

on:
  pull_request: # not drafts (each job's if): a draft's pushes cost no Actions minutes, being
    #  marked ready for review runs everything once; test locally meanwhile
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    if: ${{ !github.event.pull_request.draft }}
    # changed C++ lines follow .clang-format (one clang-format version for everyone: results
    #  differ between versions)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - run: python -m pip install clang-format==22.1.8

    # exit 0: nothing to change, 1: a diff, other: an error
    - run: |
        mb=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
        rc=0
        git clang-format --diff --extensions c,cc,cpp,h,hpp,ipp "$mb" -- inc src tst \
          > format.diff || rc=$?
        [ "$rc" -le 1 ] || { cat format.diff; exit "$rc"; }
        if grep -q '^diff --git' format.diff; then
          cat format.diff
          echo "run: git clang-format $mb -- inc src tst"
          exit 1
        fi

  python:
    if: ${{ !github.event.pull_request.draft }}
    # changed Python files pass black and ruff (versions pinned: results differ between versions)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-python@v5
      with:
        python-version: "3.13"

    - run: python -m pip install black==26.5.1 ruff==0.17.0

    - run: |
        mb=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
        mapfile -t files < <(git diff --name-only --diff-filter=ACMR "$mb" HEAD -- '*.py')
        [ "${#files[@]}" -gt 0 ] || { echo "no Python changes"; exit 0; }
        printf '%s\n' "${files[@]}"
        rc=0
        python -m black --check --diff "${files[@]}" || rc=1
        python -m ruff check --output-format github "${files[@]}" || rc=1
        [ "$rc" -eq 0 ] || echo "run: ./sh/lint.sh (or black / ruff check --fix on the files above)"
        exit "$rc"

  iwyu:
    if: ${{ !github.event.pull_request.draft }}
    # include what you use: applying iwyu's suggestions changes nothing
    # Debian 13: the same iwyu (8.23) and libstdc++ as development machines, results differ
    # between versions; also a much smaller image than phare_dep
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 30
    steps:
    - run: |  # git before checkout, so the checkout is a repository
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl git g++ python3 python3-dev \
          openmpi-bin libopenmpi-dev libhdf5-openmpi-dev iwyu # HDF5 is MPI's build, as locally

    - uses: actions/checkout@v4

    - run: |
        curl -Lo mkn https://github.com/mkn/mkn/releases/download/latest/mkn_nix
        chmod +x mkn
        KLOG=3 ./mkn build -dtKOqp iwyu_fix -Wx res/mkn/mpi # build: the module must link
        git config --global --add safe.directory "$PWD"
        if ! git diff --exit-code -- inc src tst; then
          echo "run: mkn build -p iwyu_fix -x res/mkn/mpi, and commit the result"
          exit 1
        fi

  clang-tidy:
    if: ${{ !github.event.pull_request.draft }}
    # .clang-tidy's checks on the changed C++ lines: clang-tidy reads the real compile commands,
    #  from an mkn dry run (res/ci/compile_db.py: no build). Findings show inline on the PR
    #  (annotations). Warning only for now.
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 20
    steps:
    # Debian 13's clang-tidy 22, the same as development machines (results differ between versions)
    - run: |  # git before checkout, so the checkout is a repository
        apt-get update
        apt-get install -y --no-install-recommends ca-certificates curl git g++ python3 python3-dev \
          clang-tidy-22 openmpi-bin libopenmpi-dev libhdf5-openmpi-dev # mpicxx: MPI's flags
        clang-tidy-22 --version

    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: compile commands
      run: |
        git config --global --add safe.directory "$PWD"
        curl -Lo mkn https://github.com/mkn/mkn/releases/download/latest/mkn_nix
        chmod +x mkn && mv mkn /usr/local/bin/mkn
        python3 res/ci/compile_db.py mod,mod_lattice -dKO -x res/mkn/mpi

    - continue-on-error: true # warning only (step level: the job stays green)
      run: |
        mb=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
        git diff -U0 "$mb" HEAD -- inc src tst \
          | clang-tidy-diff-22.py -clang-tidy-binary clang-tidy-22 -p1 -path . -j "$(nproc)" \
                                  -quiet -iregex '.*\.(c|cc|cpp|h|hpp|ipp)' > tidy.log 2>&1 || true
        python3 res/ci/tidy_annotations.py tidy.log "$PWD"
        ! grep -qE ": (warning|error): .*\[" tidy.log # the step fails (yellow) on findings
