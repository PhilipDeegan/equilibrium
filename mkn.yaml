#! clean build -qp mod -dtOa -fPIC -g 0

name: equilibrium

property:
  mkn.avx.version: master

profile:

- name: mod
  inc: inc
  src: src/mod.cpp
  self: lattice_deps
  mode: none
  mod: lang.python3 python3.module
  out: cpp
  install: equilibrium
  env: |
    MKN_LIB_LINK_LIB=1
    MKN_PYTHON_LIB_EMBED=0

- name: mod_lattice
  self: lattice_core phlop highfive damn_mpi
  inc: inc
  src: src/eq/lattice.cpp
       src/eq/clusters.cpp
       tpp/phlop/src/phlop/timing/scope_timer.cpp
  mode: none
  mod: lang.python3 python3.module
  out: lattice
  install: equilibrium
  arg: -fPIC -std=c++20
  env: |
    MKN_LIB_LINK_LIB=1
    MKN_PYTHON_LIB_EMBED=0

- name: lattice_core
  self: lattice_deps
  src: tpp/phlop/src/phlop/timing/scope_timer.cpp

- name: lattice_deps
  self: cppdict thread_pool phlop
  dep: lang.nanobind&tpp/nanobind mkn.kul mkn.avx

- name: test_lattice
  inc: inc
  mode: none
  self: cppdict thread_pool highfive
  test: tst/eq/core/data/lattice/test_(\w+).cpp

# needs an MPI compiler, -x mpi, as the python module (one damn build for both); serial: mpi_ranks 0
- name: test_damn_clusters
  inc: . inc
  mode: none
  self: cppdict thread_pool damn_mpi
  arg: -std=c++20
  test: tst/eq/damn/test_(\w+).cpp

# tpp/damn may be a symlink to a local damn checkout, otherwise it is cloned; needs an MPI
# compiler, -x mpi
- name: damn_mpi
  dep: damn&tpp/damn(https://github.com/PhilipDeegan/damn)[damn_mpi]

- name: test_damn_clusters_mpi
  inc: . inc
  mode: none
  self: cppdict thread_pool damn_mpi
  arg: -std=c++20
  main: tst/eq/damn_mpi/test_clusters_mpi.cpp

- name: test_kelvin_levels_mpi
  inc: . inc
  mode: none
  self: cppdict thread_pool damn_mpi
  arg: -std=c++20
  main: tst/eq/damn_mpi/test_kelvin_levels_mpi.cpp

- name: check_amr_junctions
  inc: inc
  mode: none
  self: cppdict thread_pool highfive
  main: tst/eq/core/data/lattice/check_amr_junctions.cpp

- name: measure_junction_ghost_error
  inc: inc
  mode: none
  self: cppdict thread_pool highfive
  main: tst/eq/core/data/lattice/measure_junction_ghost_error.cpp

- name: cppdict
  sub: cppdict&tpp/cppdict(https://github.com/LaboratoryOfPlasmaPhysics/cppdict)
  inc: tpp/cppdict/include

- name: thread_pool
  sub: bto&tpp/bto(https://github.com/bshoshany/thread-pool)
  inc: tpp/bto/include

- name: highfive
  sub: h5&tpp/highfive(https://github.com/highfive-devs/highfive)
  inc: tpp/highfive/include
  lib: hdf5

- name: phlop
  sub: phlop&tpp/phlop(https://github.com/PhilipDeegan/phlop)
  inc: tpp/phlop/inc

- name: floater
  sub: mppp&tpp/mppp(https://github.com/bluescarni/mppp)
  main: floater.cpp
  inc: tpp/mppp/include
  src: tpp/mppp/src

- name: clang.tidy
  src: src
  self: lattice_deps
  mod:
  - name: clang.tidy
    version: master
    arg:
        link:
            args: -DArg       #(optional, default="")
            checks: CSV       #(optional, default="", see: [link](https://clang.llvm.org/extra/clang-tidy/checks/list.html))
            config: file      #(optional, default='.clang-tidy')
            types: cpp:cxx:cc #(optional, default=cpp:cxx:cc)
# include-what-you-use report for inc/, needs iwyu on PATH
- name: iwyu
  self: lattice_core phlop highfive damn_mpi
  inc: inc
  mode: none
  mod:
  - name: lang.python3
  - name: cpp.iwyu
    compile:
      paths: inc
      inc: /usr/lib/x86_64-linux-gnu/openmpi/include /usr/lib/x86_64-linux-gnu/openmpi/include/openmpi
      headers: -x c++-header
      args: -Xiwyu --cxx17ns -Xiwyu --mapping_file=res/iwyu.imp

# iwyu's suggestions applied (fix_include): CI builds this and fails on any resulting diff
# mpicxx adds MPI's include directories itself, iwyu needs them given (Debian/Ubuntu openmpi)
- name: iwyu_fix
  self: lattice_core phlop highfive damn_mpi
  inc: inc
  mode: none
  mod:
  - name: lang.python3
  - name: cpp.iwyu
    compile:
      paths: inc
      inc: /usr/lib/x86_64-linux-gnu/openmpi/include /usr/lib/x86_64-linux-gnu/openmpi/include/openmpi
      headers: -x c++-header
      args: -Xiwyu --cxx17ns -Xiwyu --mapping_file=res/iwyu.imp
      # --noreorder keeps the include order (eq, other, system), --nosafe_headers lets it
      # remove unused includes from headers too
      fix: --nocomments --noreorder --nosafe_headers
      system_last: true
